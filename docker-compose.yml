version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: metaldle-postgres
    environment:
      POSTGRES_DB: metaldle
      POSTGRES_USER: metaldle_user
      POSTGRES_PASSWORD: metaldle_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metaldle_user -d metaldle"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: metaldle-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  api:
    build:
      context: .
      dockerfile: Metaldle.API/Dockerfile
    ports:
      - "5251:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__PostgreSQL=Host=postgres;Port=5432;Database=metaldle;Username=metaldle_user;Password=metaldle_password
      - ConnectionStrings__Redis=redis:6379
  
  blazor:
    build:
      context: .
      dockerfile: Metaldle.BlazorWASM/Dockerfile
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data: